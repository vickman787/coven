services:
  postgres:
    image: postgres:16-alpine
    container_name: coven-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coven}
      POSTGRES_DB: ${POSTGRES_DB:-coven}
    ports:
      - "5432:5432"
    volumes:
      - coven-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coven}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coven-postgres-data:
